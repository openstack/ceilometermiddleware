[build-system]
requires = ["pbr>=6.1.1"]
build-backend = "pbr.build"

[project]
name = "ceilometermiddleware"
description = "OpenStack Telemetry middleware for generating metrics"
readme = "README.rst"
authors = [
    {name = "OpenStack", email = "openstack-discuss@lists.openstack.org"},
]
requires-python = ">=3.11"
license = "Apache-2.0"
dynamic = ["version", "dependencies"]
classifiers = [
    "Environment :: OpenStack",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://docs.openstack.org/ceilometermiddleware"
Repository = "https://opendev.org/openstack/ceilometermiddleware"

[project.entry-points."paste.filter_factory"]
"swift" = "ceilometermiddleware.swift:filter_factory"

[tool.setuptools.packages.find]
include = ["ceilometermiddleware*"]

[tool.autopep8]
aggressive = 3
in-place = true
recursive = true
ignore = ["E731"]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = [
    # mcabe complexity checks
    "C90",
    # multiple-imports-on-one-line, module-import-not-at-top-of-file
    "E4",
    # line-too-long, redundant-backslash
    "E5",
    "E7",
    "E9",
    # pyflakes
    "F",
    "G",
    "LOG",
    "UP",
    "W",
]
external = ["H"]
ignore = [
    # UP031 % format — defer f-string migration to a later pass
    "UP031",
    # UP032 f-string — defer migration to a later pass
    "UP032",
]

[tool.ruff.lint.mccabe]
# Flag errors (`C901`) whenever the complexity level exceeds 15.
max-complexity = 20
